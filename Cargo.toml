[package]
name = "omnifind"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Async metasearch and web-content extraction powered by primp"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bmihalik/omnifind"
readme = "README.md"
keywords = ["search", "metasearch", "duckduckgo", "wikipedia", "scraping"]
categories = ["web-programming::http-client", "api-bindings"]
include = ["src/**", "examples/**", "tests/**", "Cargo.toml", "README.md", "AUTHORS.md", "LICENSE-*"]

[dependencies]
futures = "0.3"
primp = { version = "2.0.1", default-features = false, features = ["cookies", "form", "query", "gzip", "brotli", "zstd", "deflate"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
rmcp = { version = "=3.6.0", default-features = false, features = ["server", "macros", "transport-io"] }

[[example]]
name = "cli"
path = "examples/cli.rs"
test = true

[[example]]
name = "mcp"
path = "examples/mcp.rs"
test = true

